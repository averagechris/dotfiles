# Fast lint checks - format and static analysis
image: nixos/unstable
packages:
  - nixos.alejandra
  - nixos.statix
sources:
  - https://git.sr.ht/~averagechris/dotfiles
tasks:
  - format: |
      cd ~/dotfiles
      echo "Checking code formatting with alejandra..."
      alejandra --check .

  - lint: |
      cd ~/dotfiles
      echo "Linting with statix..."
      statix check
