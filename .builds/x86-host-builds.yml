# Active x86_64 NixOS host builds. Hosts run sequentially in one VM so the
# evaluator peak stays bounded while the Nix store/cache is reused across hosts.
image: nixos/unstable
packages:
  - nixos.cachix
sources:
  - https://git.sr.ht/~averagechris/dotfiles
secrets:
  - 731f7e55-4497-4228-8fa4-1657da7d3625
tasks:
  - setup: |
      source ~/dotfiles/scripts/ci-setup.sh

  - x86-host-builds: |
      cd ~/dotfiles
      scripts/ci-check-tiers.sh x86-host-builds
