# Eval-only Darwin coverage plus selected high-signal desktop check derivations.
# suremac is evaluated only; Darwin closures are not built on Linux.
image: nixos/unstable
packages:
  - nixos.cachix
sources:
  - https://git.sr.ht/~averagechris/dotfiles
secrets:
  - 731f7e55-4497-4228-8fa4-1657da7d3625
tasks:
  - setup: |
      source ~/dotfiles/scripts/ci-setup.sh

  - coverage-checks: |
      cd ~/dotfiles
      scripts/ci-check-tiers.sh coverage-checks
