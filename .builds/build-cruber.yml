# Build cruber NixOS configuration
image: nixos/unstable
packages:
  - nixos.cachix
sources:
  - https://git.sr.ht/~averagechris/dotfiles
secrets:
  - 731f7e55-4497-4228-8fa4-1657da7d3625
tasks:
  - setup: |
      source ~/dotfiles/scripts/ci-setup.sh

  - build: |
      cd ~/dotfiles
      echo "Building cruber..."
      cachix watch-exec averagechris-dotfiles -- \
          nix build --accept-flake-config \
          .#nixosConfigurations.cruber.config.system.build.toplevel
