image: nixos/unstable
packages:
  - nixos.cachix
sources:
  - https://git.sr.ht/~averagechris/dotfiles
secrets:
  - 731f7e55-4497-4228-8fa4-1657da7d3625
tasks:
  - setup-nix: |
      mkdir -p ~/.config/nix/
      echo "experimental-features = nix-command flakes" >> ~/.config/nix/nix.conf
      echo "max-jobs = auto" >> ~/.config/nix/nix.conf

  - setup-cachix: |
      cachix authtoken --stdin < ~/.ci_secrets/cachix_token
      cachix use averagechris-dotfiles

  - pre-commit-checks: |
      cd ~/dotfiles

      cachix watch-exec averagechris-dotfiles -- \
          nix develop --accept-flake-config --command \
          pre-commit run --all

  - nix-build-nixos-configurations: |
      cd ~/dotfiles

      cachix watch-exec averagechris-dotfiles -- \
          nix build --accept-flake-config .#nixosConfigurations.tom.config.system.build.toplevel

      cachix watch-exec averagechris-dotfiles -- \
          nix build --accept-flake-config .#nixosConfigurations.thorny.config.system.build.toplevel

      cachix watch-exec averagechris-dotfiles -- \
          nix build --accept-flake-config .#nixosConfigurations.cruber.config.system.build.toplevel
