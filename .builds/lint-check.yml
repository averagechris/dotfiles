# Fast ordinary CI: formatting, statix, and shared eval-only flake checks.
image: nixos/unstable
packages:
  - nixos.cachix
  - nixos.alejandra
  - nixos.shellcheck
  - nixos.statix
sources:
  - https://git.sr.ht/~averagechris/dotfiles
secrets:
  - 5ec60320-e0d8-4ebe-8b45-1d10cc4d2cb2
tasks:
  - setup: |
      source ~/dotfiles/scripts/ci-setup.sh

  - fast-checks: |
      cd ~/dotfiles
      scripts/ci-check-tiers.sh fast
