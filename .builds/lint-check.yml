# Lint and flake validation
image: nixos/unstable
packages:
  - nixos.cachix
  - nixos.alejandra
  - nixos.statix
sources:
  - https://git.sr.ht/~averagechris/dotfiles
secrets:
  - 731f7e55-4497-4228-8fa4-1657da7d3625
tasks:
  - setup: |
      mkdir -p ~/.config/nix/
      echo "experimental-features = nix-command flakes" >> ~/.config/nix/nix.conf
      cachix authtoken --stdin < ~/.ci_secrets/cachix_token
      cachix use averagechris-dotfiles

  - format: |
      cd ~/dotfiles
      echo "Checking code formatting with alejandra..."
      alejandra --check .

  - lint: |
      cd ~/dotfiles
      echo "Linting with statix..."
      statix check

  - check: |
      cd ~/dotfiles
      echo "Checking top-level flake..."
      nix flake check --accept-flake-config
