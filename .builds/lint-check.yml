# Lint and flake validation
image: nixos/unstable
packages:
  - nixos.cachix
  - nixos.alejandra
  - nixos.statix
sources:
  - https://git.sr.ht/~averagechris/dotfiles
secrets:
  - 731f7e55-4497-4228-8fa4-1657da7d3625
tasks:
  - setup: |
      source ~/dotfiles/scripts/ci-setup.sh

  - format: |
      cd ~/dotfiles
      echo "Checking code formatting with alejandra..."
      alejandra --check .

  - lint: |
      cd ~/dotfiles
      echo "Linting with statix..."
      statix check

  - check: |
      cd ~/dotfiles
      echo "Checking top-level flake..."
      # FOLLOW-UP (2026-07-05): this task evaluates every host system and is
      # too heavy for the build VM — it has been OOM-killed and has hit the
      # job timeout. Options: shard per-host, eval-only checks, or drop in
      # favor of thorny's dotfiles-host-build-cache timer (docs/thorny.md),
      # which already builds all hosts from main with real hardware.
      nix flake check --accept-flake-config

  - check-host-flakes: |
      cd ~/dotfiles
      echo "Checking individual host flakes..."
      for host in trap thorny tom cruber suremac; do
        echo "Checking flakes/hosts/$host..."
        nix flake check --accept-flake-config --no-build "./flakes/hosts/$host"
      done
      echo "Checking shared module flakes..."
      nix flake check --accept-flake-config --no-build ./flakes/base-lib
      nix flake check --accept-flake-config --no-build ./flakes/nixos-modules
      nix flake check --accept-flake-config --no-build ./flakes/hm-modules
      nix flake check --accept-flake-config --no-build ./flakes/darwin-modules
