# Validate suremac Darwin configuration (syntax/eval only - cannot build on Linux)
image: nixos/unstable
packages:
  - nixos.cachix
sources:
  - https://git.sr.ht/~averagechris/dotfiles
secrets:
  - 731f7e55-4497-4228-8fa4-1657da7d3625
tasks:
  - setup: |
      mkdir -p ~/.config/nix/
      echo "experimental-features = nix-command flakes" >> ~/.config/nix/nix.conf
      cachix authtoken --stdin < ~/.ci_secrets/cachix_token
      cachix use averagechris-dotfiles

  - check: |
      cd ~/dotfiles
      echo "Checking suremac flake (Darwin - syntax/eval only)..."
      nix flake check ./flakes/hosts/suremac --accept-flake-config --no-build
