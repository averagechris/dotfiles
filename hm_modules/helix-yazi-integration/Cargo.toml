[package]
name = "helix-yazi-integration"
version = "0.1.0"
edition = "2021"
authors = ["Chris <your-email>"]
description = "Integration between Helix editor and Yazi file manager via WezTerm"
license = "MIT"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
which = "5.0"
log = "0.4"
env_logger = "0.10"
dirs = "5.0"
toml = "0.8"

[profile.release]
opt-level = 3
lto = true
strip = true