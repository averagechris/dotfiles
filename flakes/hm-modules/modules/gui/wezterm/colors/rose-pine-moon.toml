# Rose Pine Moon color scheme for wezterm
# Based on https://rosepinetheme.com/

[colors]
foreground = "#e0def4"
background = "#232136"
cursor_bg = "#e0def4"
cursor_fg = "#232136"
cursor_border = "#e0def4"
selection_bg = "#44415a"
selection_fg = "#e0def4"

ansi = [
    "#393552",  # black
    "#eb6f92",  # red
    "#9ccfd8",  # green
    "#f6c177",  # yellow
    "#3e8fb0",  # blue
    "#c4a7e7",  # magenta
    "#ea9a97",  # cyan
    "#e0def4",  # white
]

brights = [
    "#6e6a86",  # bright black
    "#eb6f92",  # bright red
    "#9ccfd8",  # bright green
    "#f6c177",  # bright yellow
    "#3e8fb0",  # bright blue
    "#c4a7e7",  # bright magenta
    "#ea9a97",  # bright cyan
    "#e0def4",  # bright white
]

# Tabs
tab_bar.background = "#232136"
tab_bar.active_tab.bg_color = "#3e8fb0"
tab_bar.active_tab.fg_color = "#e0def4"
tab_bar.inactive_tab.bg_color = "#2a273f"
tab_bar.inactive_tab.fg_color = "#6e6a86"
tab_bar.inactive_tab_hover.bg_color = "#393552"
tab_bar.inactive_tab_hover.fg_color = "#e0def4"