[package]
name = "hctl"
version = "0.1.0"
edition = "2021"
authors = ["Chris Cummings"]
description = "Hyprland ergonomics control CLI and daemon"
license = "MIT"

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = true
strip = true
