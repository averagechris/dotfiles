# Rose Pine Moon theme for Yazi
# Based on https://rosepinetheme.com/palette/ingredients/

[mgr]
# UI elements
cwd = { fg = "#e0def4", bold = true }
search_results = { fg = "#ea9a97" }
help_bar = { fg = "#e0def4", bg = "#2a273f", italic = true }
filetype = { fg = "#e0def4" }

# File type colors
directory = { fg = "#c4a7e7", bold = true }
file = { fg = "#e0def4" }
link = { fg = "#f6c177", italic = true }
executable = { fg = "#9ccfd8", bold = true }
virtualization = { fg = "#c4a7e7" }

# Status elements
border = { fg = "#393552" }
scrollbar = { fg = "#56526e", bg = "#232136" }
selected = { fg = "#232136", bg = "#c4a7e7" }
current = { fg = "#e0def4", bg = "#44415a" }
preview_border = { fg = "#393552" }
preview_line = { fg = "#31748f" }
permissions = { fg = "#908caa" }
size = { fg = "#908caa" }
user = { fg = "#908caa" }
group = { fg = "#908caa" }
date = { fg = "#908caa" }

[input]
border = { fg = "#393552" }
title = { fg = "#c4a7e7", bold = true }
value = { fg = "#e0def4" }
selected = { bg = "#393552" }

[select]
border = { fg = "#393552" }
title = { fg = "#ea9a97", bold = true }
selected = { bg = "#393552" }
unselected = { fg = "#908caa" }

[tasks]
border = { fg = "#393552" }
title = { fg = "#9ccfd8", bold = true }
spinner = { fg = "#f6c177", bold = true }
progress = { fg = "#eb6f92" }
failed = { fg = "#eb6f92" }
header = { fg = "#908caa" }

[filetype]
rules = [
  # Images
  { mime = "image/*", fg = "#ebbcba" },
  
  # Videos
  { mime = "video/*", fg = "#f6c177" },
  
  # Audio
  { mime = "audio/*", fg = "#c4a7e7" },
  
  # Archives
  { mime = "application/zip", fg = "#f6c177" },
  { mime = "application/gzip", fg = "#f6c177" },
  { mime = "application/x-tar", fg = "#f6c177" },
  { mime = "application/x-bzip", fg = "#f6c177" },
  { mime = "application/x-bzip2", fg = "#f6c177" },
  { mime = "application/x-7z-compressed", fg = "#f6c177" },
  { mime = "application/x-rar", fg = "#f6c177" },
  
  # Documents
  { mime = "application/pdf", fg = "#eb6f92" },
  { mime = "application/msword", fg = "#eb6f92" },
  { mime = "application/vnd.ms-excel", fg = "#eb6f92" },
  { mime = "application/vnd.ms-powerpoint", fg = "#eb6f92" },
  
  # Text
  { mime = "text/*", fg = "#e0def4" },
  
  # Programming
  { mime = "text/x-c", fg = "#9ccfd8" },
  { mime = "text/x-c++", fg = "#9ccfd8" },
  { mime = "text/x-python", fg = "#9ccfd8" },
  { mime = "text/x-java", fg = "#9ccfd8" },
  { mime = "text/x-rust", fg = "#9ccfd8" },
  { mime = "text/x-haskell", fg = "#9ccfd8" },
  { mime = "text/x-makefile", fg = "#9ccfd8" },
  { mime = "text/x-lua", fg = "#9ccfd8" },
  { mime = "text/javascript", fg = "#9ccfd8" },
  { mime = "application/json", fg = "#9ccfd8" },
  
  # Hidden files
  # Yazi 26.5 filetype rules match names/paths with `url`; the old `name`
  # key is only valid for icon rules.
  { url = "**/.*", fg = "#56526e" },
  
  # Source control
  { url = "**/.git", fg = "#eb6f92" },
  { url = "**/.github", fg = "#eb6f92" },
  { url = "**/.gitignore", fg = "#eb6f92" },
  { url = "**/.gitmodules", fg = "#eb6f92" },
  
  # Special files
  { url = "**/Makefile", fg = "#31748f", bold = true },
  { url = "**/Cargo.toml", fg = "#31748f", bold = true },
  { url = "**/Cargo.lock", fg = "#56526e" },
  { url = "**/flake.nix", fg = "#31748f", bold = true },
  { url = "**/flake.lock", fg = "#56526e" },
  { url = "**/*.nix", fg = "#31748f" },
  
  # Nix specific
  { url = "**/result", fg = "#9ccfd8", bold = true },
]
