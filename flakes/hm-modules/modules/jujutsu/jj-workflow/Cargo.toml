[package]
name = "jj-workflow"
version = "0.1.0"
edition = "2021"
authors = ["Chris Cummings"]
description = "Workflow helpers for jj ship and jj sync"
license = "MIT"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
which = "8.0"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
toml = "0.9"

[profile.release]
opt-level = 3
lto = true
strip = true
